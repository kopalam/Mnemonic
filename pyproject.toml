[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemonic"
version = "0.2.0"
description = "Multi-tenant AI Agent persistent memory storage middleware"
authors = [{name = "HNOE"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.20",
    "httpx>=0.27",
    "jieba>=0.42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

# Hermes插件入口点 - 自动注册
[project.entry-points."hermes.memory_providers"]
mnemonic = "mnemonic_plugin:MemoryProvider"

[project.scripts]
mnemonic-api = "mnemonic.api:main"

[tool.hatch.build.targets.wheel]
packages = ["mnemonic"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.env",
    "/.env.example",
    "/tests",
    "/docker-compose.yml",
    "/Dockerfile",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
