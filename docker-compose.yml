version: "3.8"

services:
  # FastAPI API Server
  mnemonic-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mnemonic-api
    restart: always
    ports:
      - "8010:8010"
    environment:
      MNEMONIC_DB_HOST: ${MNEMONIC_DB_HOST:-120.25.63.187}
      MNEMONIC_DB_PORT: ${MNEMONIC_DB_PORT:-8771}
      MNEMONIC_DB_NAME: ${MNEMONIC_DB_NAME:-mnemonic}
      MNEMONIC_DB_USER: ${MNEMONIC_DB_USER:-funkits}
      MNEMONIC_DB_PASSWORD: ${MNEMONIC_DB_PASSWORD}
      MNEMONIC_LLM_API_KEY: ${MNEMONIC_LLM_API_KEY}
      MNEMONIC_LLM_FALLBACK_API_KEY: ${MNEMONIC_LLM_FALLBACK_API_KEY}
      MNEMONIC_EMBEDDING_API_KEY: ${MNEMONIC_EMBEDDING_API_KEY}
    volumes:
      # 代码热挂载 - 改代码不用rebuild
      - ./mnemonic:/app/mnemonic:ro
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8010/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
